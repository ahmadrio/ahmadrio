<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" fill="none" role="img" aria-label="Ahmad Rio - Fullstack and AI Developer, Malang, Indonesia">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9">
        <animate attributeName="stop-color" values="#6d28d9;#2563eb;#0ea5e9;#6d28d9" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#0ea5e9;#6d28d9;#2563eb" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#6d28d9;#2563eb;#0ea5e9" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="220" rx="16" /></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#bg)" />

    <!-- soft moving glow -->
    <circle cx="180" cy="60" r="220" fill="#ffffff" opacity="0.06">
      <animate attributeName="cx" values="180;820;180" dur="18s" repeatCount="indefinite" />
    </circle>

    <!-- bottom waves -->
    <path fill="#ffffff" opacity="0.10" d="M0 170 C 150 140, 350 210, 550 175 S 900 150, 1000 180 V220 H0 Z">
      <animate attributeName="d"
        values="M0 170 C 150 140, 350 210, 550 175 S 900 150, 1000 180 V220 H0 Z;
                M0 178 C 180 205, 360 150, 560 185 S 880 205, 1000 168 V220 H0 Z;
                M0 170 C 150 140, 350 210, 550 175 S 900 150, 1000 180 V220 H0 Z"
        dur="10s" repeatCount="indefinite" />
    </path>
    <path fill="#ffffff" opacity="0.16" d="M0 190 C 200 165, 380 220, 600 195 S 880 175, 1000 200 V220 H0 Z">
      <animate attributeName="d"
        values="M0 190 C 200 165, 380 220, 600 195 S 880 175, 1000 200 V220 H0 Z;
                M0 196 C 220 220, 400 170, 620 200 S 900 220, 1000 190 V220 H0 Z;
                M0 190 C 200 165, 380 220, 600 195 S 880 175, 1000 200 V220 H0 Z"
        dur="8s" repeatCount="indefinite" />
    </path>

    <!-- monogram -->
    <g opacity="0.9">
      <rect x="52" y="70" width="72" height="72" rx="14" fill="#ffffff" opacity="0.14" />
      <text x="88" y="119" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="30" font-weight="700" fill="#ffffff">AR</text>
    </g>

    <!-- title + subtitle -->
    <text x="152" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="#ffffff">Ahmad Rio</text>
    <text x="154" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#ffffff" opacity="0.92">Fullstack &amp; AI Developer  ·  Malang, Indonesia</text>
  </g>
</svg>
